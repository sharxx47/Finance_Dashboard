  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#0C0603;overflow-x:hidden;
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;
    color:#FFF4EC;min-height:100vh;min-height:100dvh}
  a{color:#FF8A3D;text-decoration:none}
  a:hover{color:#FFB07A}
  .bg{position:fixed;inset:0;pointer-events:none;background:
    radial-gradient(120% 68% at 50% -12%,rgba(255,95,0,.60) 0%,rgba(255,95,0,.16) 38%,rgba(255,95,0,0) 66%),
    radial-gradient(90% 50% at 50% 108%,rgba(255,120,20,.16) 0%,rgba(255,120,20,0) 60%),
    linear-gradient(180deg,#17100C 0%,#0E0907 46%,#090605 100%)}
  .col{position:relative;max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom))}
  .glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:24px;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  .hero{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18);border-radius:30px;padding:28px 24px 26px;
    -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
    box-shadow:0 20px 50px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.22)}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 4px}
  .mark{font-size:19px;font-weight:700;letter-spacing:-.015em}
  .pill{font-size:12px;font-weight:500;color:rgba(255,244,236,.72);background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);padding:7px 13px;border-radius:999px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .cap{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,244,236,.62)}
  .big{font-size:clamp(54px,16vw,66px);font-weight:700;letter-spacing:-.045em;line-height:.95;font-variant-numeric:tabular-nums}
  .split{display:flex;height:12px;gap:4px;margin-top:26px}
  .split div{border-radius:999px}
  .legend{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:13px}
  .dot{width:9px;height:9px;border-radius:999px;display:block}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tile{padding:20px 18px}
  .tlab{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,244,236,.58)}
  .tnum{font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums}
  .panel{border-radius:28px;padding:24px 20px 22px}
  .h2{font-size:21px;font-weight:700;letter-spacing:-.015em}
  .sub{font-size:12px;color:rgba(255,244,236,.5)}
  .mosaic{display:flex;flex-direction:column;gap:4px;margin-top:16px}
  .mrow{display:flex;gap:4px}
  .cell{border-radius:14px;padding:13px 14px;display:flex;flex-direction:column-reverse;
    align-items:flex-start;justify-content:flex-end;min-width:0;overflow:hidden}
  .cname{font-weight:600;opacity:.72;line-height:1.15;overflow-wrap:anywhere;min-width:0}
  .camt{font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap}

  /* ---- drill-down ---- */
  .cell{width:100%;height:100%;font:inherit;text-align:left;cursor:pointer;-webkit-appearance:none;
    border:0;position:relative;
    transition:transform .16s cubic-bezier(.4,0,.2,1),filter .2s,box-shadow .2s}
  .cell:active{transform:scale(.975)}
  /* The unopened tiles shrink by the same amount the opened one grows, so the
     lift opens a gap around it instead of overlapping its neighbours. */
  .mosaic.picked .cell{filter:saturate(.35) brightness(.62);transform:scale(.965)}
  /* The opened tile lifts toward the reader: slightly larger, above its
     neighbours, with a cast shadow. The faded siblings are what let the small
     overlap read as depth rather than as a layout error. */
  .mosaic.picked .cell[aria-expanded="true"]{filter:none;z-index:2;transform:scale(1.035);
    box-shadow:0 16px 38px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.22)}
  .cell[aria-expanded="true"] .cname{opacity:1}

  /* Moved into the mosaic, directly after the row holding the tapped tile, so
     the rows below are pushed down rather than the detail opening at the far
     end of the panel. Taken back out when closed. */
  .sheet{overflow:hidden;transition:height .28s cubic-bezier(.4,0,.2,1);flex:none}
  /* Exit runs faster than entry — a standard motion asymmetry that keeps a
     switch feeling responsive rather than like two full animations queued. */
  .sheet.closing{transition-duration:.17s}
  /* Equal band above and below: without the lower half the detail sat hard
     against the next row of tiles. */
  .sheetin{padding:18px 0;opacity:1;transition:opacity .16s ease}
  .sheet.closing .sheetin{opacity:0}
  .shead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .stitle{font-size:15px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
  .scount{font-size:11.5px;color:rgba(255,244,236,.5);white-space:nowrap;font-variant-numeric:tabular-nums}
  .grouplab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(255,244,236,.45)}

  /* 10px of padding on the row, not gap between rows: the live target reaches
     the 44px minimum without changing the visual rhythm. */
  .vrows{display:flex;flex-direction:column;gap:0}
  .vrow{display:flex;flex-direction:column;gap:5px;padding:10px 0}
  .vrow.tap{cursor:pointer}
  .vtop{display:flex;align-items:baseline;gap:0}
  .vn{font-size:13px;font-weight:600;line-height:1.25;text-wrap:pretty;padding-right:10px}
  /* The payment count rides on the amount row rather than taking a line of its
     own — five sub-lines cost ~50px, and the dates still live on the items and
     on the unfolded rows, where they are read. */
  .vcount{font-size:10.5px;font-weight:600;color:rgba(255,244,236,.38);
    font-variant-numeric:tabular-nums;margin-left:auto;padding-right:9px}
  .va{font-size:13px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .vtrack{height:4px;border-radius:999px;background:rgba(255,244,236,.08)}
  .vtrack i{display:block;height:100%;border-radius:999px;background:#FF8A3D;transition:background .2s}
  /* Chevron marks a place as expandable, and flips when it is open. */
  .vrow.tap .vn::after{content:"";display:inline-block;width:5px;height:5px;margin-left:8px;
    border-right:1.5px solid rgba(255,244,236,.45);border-bottom:1.5px solid rgba(255,244,236,.45);
    transform:translateY(-1px) rotate(45deg);transition:transform .2s}
  .vrow.tap[data-open="1"] .vn::after{transform:translateY(1px) rotate(225deg)}
  .nest{overflow:hidden;transition:height .24s cubic-bezier(.4,0,.2,1)}
  .nestin{padding:9px 0 3px 0}
  .nrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0}
  .nbullet{width:3px;height:3px;border-radius:999px;background:rgba(255,138,61,.7);flex:none;margin-top:7px}
  .nn{font-size:12px;font-weight:500;color:rgba(255,244,236,.66);line-height:1.3;flex:1;min-width:0}
  .na{font-size:12px;font-weight:600;color:rgba(255,244,236,.8);font-variant-numeric:tabular-nums;
    white-space:nowrap}
  .ndate{font-size:10.5px;font-weight:500;color:rgba(255,244,236,.36);margin-left:7px;
    font-variant-numeric:tabular-nums}

  .divide{height:1px;background:rgba(255,244,236,.14);margin:18px 0 16px}
  .irow{display:flex;align-items:baseline;gap:10px;padding:7px 0;
    border-bottom:1px solid rgba(255,244,236,.07);transition:opacity .2s}
  .irow:last-child{border-bottom:0}
  .irank{font-size:10.5px;font-weight:700;color:rgba(255,244,236,.32);width:15px;flex:none;
    font-variant-numeric:tabular-nums}
  .iwrap{flex:1;min-width:0}
  .in{font-size:12.5px;font-weight:500;line-height:1.3;text-wrap:pretty}
  .ia{font-size:12.5px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* Hidden at rest — eight always-on sub-lines cost ~120px and the resting state
     should be calm. Revealed only on the rows a tap has selected, animated and
     cascaded 35ms apart in JS: snapping four rows open at once was what made the
     filter feel clunky next to a place tap, which reveals one row while its nest
     slides. The breathing room above the text is line-height, NOT padding: under
     box-sizing:border-box padding acts as a floor max-height:0 cannot clip, so a
     hidden row would still cost 2px and the height arithmetic would be out by
     that much on every row. */
  .ivend{max-height:0;opacity:0;overflow:hidden;line-height:1.6;
    font-size:10.5px;font-weight:500;color:rgba(255,244,236,.42);letter-spacing:.02em;

/* Running balance, day by day. A lumpy salary shows as a step up; spending is

let RUN = 0;

const WIN  = 30;

const SCALE = 660, MIN_H = 66;

const CTX = document.createElement("canvas").getContext("2d");
const textW = (text, size, weight, track) => {
  CTX.font = weight + " " + size + "px Archivo, sans-serif";
  return CTX.measureText(text).width + text.length * size * track;
};

function fitName(name, boxW, base) {
  // ALWAYS uppercase: tighten letter-spacing (.13 -> 0) first, then shrink the
  // font (8px floor) only if still too wide — never fall back to sentence case.
  const word = name.split(" ").reduce((a,b) => b.length > a.length ? b : a, "");
  for (const track of [.13, .08, .04, 0]) {
    if (textW(word.toUpperCase(), base, 600, track) <= boxW)
      return { size: base, case: "uppercase", track: track + "em" };
  }
  let size = base;
  while (size > 8 && textW(word.toUpperCase(), size, 600, 0) > boxW) size -= .5;
  return { size, case: "uppercase", track: "0em" };
}

function fitAmt(val, boxW, base) {
  let size = base;
  while (size > 15 && textW(val, size, 700, -.035) > boxW) size -= .5;
  return size;
}

/* The header sub states the span the panel covers. It counts up while the
   window is still filling, then sticks at "last 30 days" once it stops growing.
   Derived, never hard-coded — a stated window that disagrees with what is
   plotted is worse than no window at all. */
function windowLabel() {
  return view.length < WIN ? view.length + " days" : "last " + WIN + " days";
}

function wowText() {
  if (wow === null) return "first week tracked";
  if (wow === 0)    return "level with the prior 7 days";
  return (wow < 0 ? "\u2193 " : "\u2191 ") + Math.abs(wow) + "% vs prior 7 days";
}

function buildChart() {
  const n = view.length;
  const bmax = Math.max(...view.map(p => p.bal), 0);
  const bmin = Math.min(...view.map(p => p.bal), 0);
  /* Every day sits on ONE x-scale, inset at each end by half a bar width. The
     inset is what makes the bar spacing uniform. On a flush 0-100 scale the end
     bars have to be nudged inward so they don't straddle the edge, which closes
     the gap to their neighbours — the first two and last two bars visibly join.
     Insetting instead lets every bar centre on its own day. */
  const barW = (100 / (n - 1)) * 0.66;
  const pad  = barW / 2;
  const X = i => pad + i / (n - 1) * (100 - 2 * pad);
  const Y = v => 15 + (bmax - v) / (bmax - bmin) * 72;   // bands for labels above/below
  const pts  = view.map((p, i) => X(i).toFixed(2) + "," + Y(p.bal).toFixed(2));
  const line = "M" + pts.join(" L");

  /* Dates every STEP days, anchored to the LAST day and walked backwards, so the
     as-of date always lands on a tick and the spacing stays exactly STEP. */
  const STEP = 5, ticks = [];
  for (let i = n - 1; i >= 0; i -= STEP) ticks.unshift(i);

  /* Labels sit ABOVE their dot (money-in, always a local peak) or BELOW it (the
     low, always a local trough) — never beside it. Placing them alongside the
     line put a 70-80px label across the neighbouring days, which forced the
     per-day dots to be dropped exactly on the steep runs that matter. Their own
     vertical band costs nothing and holds at any window length. */
  const label = (i, v, text, color, above) => {
    const x = X(i);
    const sx = x <= 12 ? "0" : x >= 88 ? "-100%" : "-50%";   // keep inside the plot
    return `<span class="clab" style="left:${x.toFixed(2)}%;top:${Y(v).toFixed(2)}%;color:${color};
      transform:translate(${sx},${above ? "calc(-100% - 11px)" : "11px"})">${text}</span>`;
  };
  const dot = (i, v, color) =>
    `<span class="cmark" style="left:${X(i).toFixed(2)}%;top:${Y(v).toFixed(2)}%;background:${color}"></span>`;

  const low = view[lowIdx];
  const marked = view.flatMap((p, i) => p.in > 0 ? [{ i, v: p.bal, text: "+" + fmt(p.in), color: TEAL, above: true }] : []);
  marked.push({ i: lowIdx, v: low.bal, text: "low " + fmt(low.bal), color: ORANGE, above: false });
  const marks = marked.map(m => dot(m.i, m.v, m.color) + label(m.i, m.v, m.text, m.color, m.above)).join("");

  /* Dots shrink as the window fills, so they read as separate days at 375px
     instead of beading into a thick line. */
  const dR = n <= 20 ? 5 : n <= 26 ? 4 : 3.5;
  const days = view.map((p, i) => (i === lowIdx || p.in > 0) ? "" :
    `<span class="cday" style="left:${X(i).toFixed(2)}%;top:${Y(p.bal).toFixed(2)}%;
      width:${dR}px;height:${dR}px;box-shadow:0 0 0 ${(dR / 2.5).toFixed(1)}px rgba(12,6,3,.75)"></span>`).join("");

  /* Spend rail: one bar per day on the same x-scale as the line above, so a tall
     bar sits directly under the drop it caused. Every bar is centred on its day
     — the inset above is what keeps the end ones inside the box. */
  const maxOut = Math.max(...vOut);
  const peakIdx = vOut.indexOf(maxOut);
  const bars = view.map((p, i) => {
    const pk = i === peakIdx;
    return `<i style="left:${X(i).toFixed(2)}%;width:${barW.toFixed(2)}%;transform:translateX(-50%);
      height:${Math.max(1, p.out / maxOut * 100).toFixed(1)}%;
      background:${pk ? "#FF8A3D" : ORANGE};opacity:${pk ? 1 : p.out ? .85 : .18}"></i>`;
  }).join("");
  const avgY = (1 - perDay / maxOut) * 100;
  const peak = view[peakIdx];
  /* The label is a filled pill centred over its own bar, resting on a short stem
     that lands on the bar's top edge, so there is no doubt which day it names.
     Clamped at the plot edges — the stem keeps pointing even when the pill has
     to shift inward. The rail carries 36px of margin above it so the pill always
     clears the "avg" figure in the caption row. */
  const pkX = X(peakIdx);
  const pkText = peak.label + " \u00B7 " + fmt(maxOut);
  /* The pill sizes itself to its text, so a longer date or a seven-figure amount
     widens the pill — the text can never spill out of it. What does need
     guarding is the pill running past the panel edge, so it is measured and
     shifted by the smallest amount that keeps it inside: centred when it fits,
     otherwise flush to whichever edge it was crossing. The stem stays on the
     bar regardless, so the pill can slide without losing its referent. */
  const plotW = document.querySelector(".rail")?.clientWidth
    || Math.max(269, Math.min(430, window.innerWidth) - 76);
  const pillW = textW(pkText, 10.5, 600, .04) + 20;      // 10px padding each side
  const pkCx  = pkX / 100 * plotW;
  let dx = -pillW / 2;
  if (pkCx + dx < 0) dx = -pkCx;
  if (pkCx + dx + pillW > plotW) dx = plotW - pillW - pkCx;
  const rail = `<div class="rail">
      ${bars}
      <span class="ravg" style="top:${avgY.toFixed(1)}%"></span>
      <span class="rstem" style="left:${pkX.toFixed(2)}%"></span>
      <span class="rpeak" style="left:${pkX.toFixed(2)}%;
        transform:translate(${dx.toFixed(1)}px,calc(-100% - 7px))">${peak.label} &middot; ${fmt(maxOut)}</span>
    </div>`;

  SCRUB = { view, X, Y, n, pad };

  const grid = ticks.filter(i => i > 0 && i < n - 1)
    .map(i => `<span class="cgrid" style="left:${X(i).toFixed(2)}%"></span>`).join("");

  const axis = `<div class="cax">${ticks.map(i =>
    `<span class="ctick" style="left:${X(i).toFixed(2)}%"></span>` +
    `<span class="cxlab" style="left:${X(i).toFixed(2)}%">${view[i].label}</span>`
  ).join("")}</div>`;

  return `<div class="chart">
      ${grid}
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="gfill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${TEAL}" stop-opacity=".30"/>
          <stop offset="1" stop-color="${TEAL}" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${line} L${X(n-1).toFixed(2)},100 L${X(0).toFixed(2)},100 Z" fill="url(#gfill)"/>
        <path d="${line}" fill="none" stroke="${TEAL}" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <span class="czero" style="top:${Y(0).toFixed(2)}%"></span>
      <span class="clab" style="left:0;top:${Y(0).toFixed(2)}%;transform:translateY(-160%);
        color:rgba(255,244,236,.38);font-size:10px;letter-spacing:.08em">0</span>
      ${days}${marks}
      <span class="shair"></span><span class="sdot"></span>
      <div class="spill"><span class="spd"></span>
        <span class="spv"><span class="spbal"></span><span class="spout"></span></span></div>
    </div>
    <div class="raillab" style="margin-top:18px"><span>Spent per day</span><b>avg ${fmt(perDay)}</b></div>
    ${rail}
    ${axis}`;
}

const NV = 5, NI = 8;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

// "top 5 of 20 places" only reads correctly when something is truncated;
// below the cut it is just the count, correctly singular.
function countLabel(shown, total, word) {
  const s = total === 1 ? word : word + "s";
  return total <= shown ? total + " " + s : "top " + shown + " of " + total + " " + s;
}

function placeRows(d) {
  const vs = d.vendors.slice(0, NV), max = Math.max(...vs.map(v => v[1]));
  return '<div class="vrows">' + vs.map(([nm, a, cnt]) => {
    const its = (d.vendItems[nm] || []).slice(0, 4);
    const nest = its.length
      ? '<div class="nest" style="height:0"><div class="nestin">' +
        its.map(([q, b, when]) => '<div class="nrow"><span class="nbullet"></span>' +
          '<span class="nn">' + esc(q) + '<span class="ndate">' + when + '</span></span>' +
          '<span class="na">' + fmt(b) + '</span></div>').join("") + '</div></div>' : '';
    return '<div class="vrow' + (its.length ? ' tap' : '') + '" data-v="' + esc(nm) + '" data-open="0">' +
      '<div class="vtop"><span class="vn">' + esc(nm) + '</span>' +
      '<span class="vcount">' + cnt + '\u00D7</span><span class="va">' + fmt(a) + '</span></div>' +
      '<div class="vtrack"><i style="width:' + Math.max(2, a / max * 100).toFixed(1) + '%"></i></div>' +
      nest + '</div>';
  }).join("") + '</div>';
}

function drill(cat) {
  const d = DETAIL[cat]; if (!d) return "";
  const its = d.items.slice(0, NI);
  const outside = its.filter(x => x[3] > NV).length;
  return '<div class="sheetin">' +
    '<div class="shead"><span class="stitle">' + esc(cat) + '</span>' +
    '<span class="scount">' + d.n + ' payment' + (d.n === 1 ? "" : "s") + '</span></div>' +
    '<div class="grouplab" style="margin:16px 0 11px"><span>Who you paid</span>' +
      '<span>' + countLabel(NV, d.vendors.length, "place") + '</span></div>' +
    placeRows(d) +
    '<div class="divide"></div>' +
    '<div class="grouplab" style="margin-bottom:6px"><span>What you bought</span>' +
      '<span>' + countLabel(NI, d.items.length, "item") + '</span></div>' +
    '<div id="ilist">' + its.map(([nm, a, v, rank, cnt, when], i) =>
      '<div class="irow" data-vend="' + esc(v) + '" data-outside="' + (rank > NV ? 1 : 0) + '">' +
      '<span class="irank">' + (i + 1) + '</span>' +
      '<span class="iwrap"><span class="in">' + esc(nm) +
        (cnt > 1 ? ' <span class="ndate" style="margin-left:4px">\u00D7' + cnt + '</span>' : '') + '</span>' +
      '<div class="ivend">' + when + ' \u00B7 ' + esc(v) +
        (rank > NV ? ' \u00B7 #' + rank + ' place' : '') + '</div></span>' +
      '<span class="ia">' + fmt(a) + '</span></div>').join("") + '</div>' +
    (outside ? '<button class="flag" id="flag" type="button" aria-pressed="false">' +
      outside + ' of these came from places outside the top ' + NV + '</button>' : '') +
    '</div>';
}

// The sheet is one element reused for every category, kept outside render() so
// it survives the innerHTML rebuild that a resize triggers.
const sheet = document.createElement("div");
sheet.className = "sheet";
sheet.style.height = "0";
let openCat = null;

function resize() { const in_ = sheet.firstElementChild; if (in_) sheet.style.height = in_.scrollHeight + "px"; }

function revealed(list) { return list.querySelectorAll(".irow.lit-place, .irow.lit-flag"); }
function subH(row) { const v = row.querySelector(".ivend"); return v ? v.scrollHeight : 0; }
function clearHighlight() {
  const list = document.getElementById("ilist"); if (!list) return;
  list.querySelectorAll(".irow").forEach(r => {
    r.classList.remove("lit-place", "lit-flag", "dim");
    const v = r.querySelector(".ivend"); if (v) v.style.transitionDelay = "0ms";
  });
  const f = document.getElementById("flag"); if (f) f.setAttribute("aria-pressed", "false");
}
// The delta only has to start the sheet moving at the right speed; the exact
// height is re-synced from the settled DOM once the last sub-line finishes,
// because a hidden .ivend and a revealed one do not report the same scrollHeight.
function applyHighlight(add) {
  const list = document.getElementById("ilist"); if (!list) { clearHighlight(); return 0; }
  let delta = 0, watch = null;
  revealed(list).forEach(r => { delta -= subH(r); watch = r.querySelector(".ivend"); });
  clearHighlight();
  if (add) add(list);
  revealed(list).forEach((r, i) => {
    delta += subH(r);
    const v = r.querySelector(".ivend");
    v.style.transitionDelay = (i * 35) + "ms";   // cascade, so the group unfolds
    watch = v;
  });
  if (watch) watch.addEventListener("transitionend", function once(e) {
    if (e.propertyName !== "max-height") return;
    watch.removeEventListener("transitionend", once); resize();
  });
  return delta;
}
// One nest open at a time: two would light two sets of items below.
function setNest(row, open) {
  const nest = row.querySelector(".nest"); if (!nest) return 0;
  const delta = open ? nest.scrollHeight : -parseFloat(nest.style.height || 0);
  row.dataset.open = open ? "1" : "0";
  nest.style.height = open ? nest.scrollHeight + "px" : "0";
  nest.addEventListener("transitionend", function once() {
    nest.removeEventListener("transitionend", once); resize();
  });
  return delta;
}

function mosSub(text) { const s = document.getElementById("mossub"); if (s) s.textContent = text; }

function placeSheet(cat, animate) {
  const t = document.querySelector('.cell[data-cat="' + cat.replace(/"/g, '\\"') + '"]');
  if (!t) return;
  t.setAttribute("aria-expanded", "true");
  document.querySelector(".mosaic").classList.add("picked");
  t.closest(".mrow").after(sheet);
  sheet.classList.remove("closing");
  sheet.innerHTML = drill(cat);
  if (animate) { sheet.style.height = "0"; requestAnimationFrame(() => { if (openCat === cat) resize(); }); }
  else { const prev = sheet.style.transition; sheet.style.transition = "none"; resize();
         requestAnimationFrame(() => { sheet.style.transition = prev; }); }
  mosSub("tap again to close");
}

document.addEventListener("click", e => {
  const t = e.target.closest(".cell");
  if (t) {
    const cat = t.dataset.cat;
    if (!DETAIL[cat]) return;
    const mosaic = document.querySelector(".mosaic");
    mosaic.querySelectorAll(".cell").forEach(b => b.setAttribute("aria-expanded", "false"));
    if (openCat === cat) {
      openCat = null; mosaic.classList.remove("picked");
      sheet.classList.remove("closing"); sheet.style.height = "0";
      mosSub("area = amount");
      setTimeout(() => { if (!openCat) { sheet.innerHTML = ""; sheet.remove(); } }, 300);
      return;
    }
    // Switching from one open category to another collapses first, then moves,
    // refills and grows, so the two halves read as one gesture. Exit runs faster
    // than entry, which keeps the switch feeling responsive.
    const switching = !!openCat;
    openCat = cat;
    if (!switching) { placeSheet(cat, true); return; }
    sheet.classList.add("closing"); sheet.style.height = "0";
    let done = false;
    const go = () => { if (done) return; done = true; if (openCat === cat) placeSheet(cat, true); };
    sheet.addEventListener("transitionend", function once(ev) {
      if (ev.propertyName !== "height") return;
      sheet.removeEventListener("transitionend", once); go();
    });
    setTimeout(go, 220);
    return;
  }

  const row = e.target.closest(".vrow.tap");
  if (row) {
    const wasOpen = row.dataset.open === "1";
    let delta = 0;
    document.querySelectorAll('.vrow.tap[data-open="1"]').forEach(r => { delta += setNest(r, false); });
    if (!wasOpen) delta += setNest(row, true);
    const hd = applyHighlight(!wasOpen ? list => list.querySelectorAll(".irow").forEach(r =>
      r.classList.add(r.dataset.vend === row.dataset.v ? "lit-place" : "dim")) : null);
    sheet.style.height = (parseFloat(sheet.style.height || 0) + delta + hd) + "px";
    return;
  }

  const f = e.target.closest("#flag");
  if (f) {
    const on = f.getAttribute("aria-pressed") === "true";
    let delta = 0;
    document.querySelectorAll('.vrow.tap[data-open="1"]').forEach(r => { delta += setNest(r, false); });
    const hd = applyHighlight(!on ? list => {
      f.setAttribute("aria-pressed", "true");
      list.querySelectorAll(".irow").forEach(r =>
        r.classList.add(r.dataset.outside === "1" ? "lit-flag" : "dim"));
    } : null);
    sheet.style.height = (parseFloat(sheet.style.height || 0) + delta + hd) + "px";
  }
});

/* Scrubbing reads one day off the chart. The readout is a pill in the chart's
   top band rather than at the fingertip, which on a phone sits under the thumb. */
let SCRUB = null, scrubIdx = null, railOrig = null;

function scrubTo(chart, clientX) {
  const S = SCRUB; if (!S) return;
  const r = chart.getBoundingClientRect();
  // invert X(i): the scale is inset by half a bar at each end
  const t = ((clientX - r.left) / r.width * 100 - S.pad) / (100 - 2 * S.pad);
  const i = Math.max(0, Math.min(S.n - 1, Math.round(t * (S.n - 1))));
  if (i === scrubIdx) return;
  scrubIdx = i;
  const p = S.view[i], x = S.X(i);
  chart.querySelector(".shair").style.left = x.toFixed(2) + "%";
  const d = chart.querySelector(".sdot");
  d.style.left = x.toFixed(2) + "%";
  d.style.top  = S.Y(p.bal).toFixed(2) + "%";
  const pill = chart.querySelector(".spill");
  pill.querySelector(".spd").textContent   = p.label;
  pill.querySelector(".spbal").textContent = (p.bal < 0 ? "\u2212" : "") + fmt(p.bal);
  pill.querySelector(".spout").textContent = p.out ? fmt(p.out) + " spent" : "nothing spent";
  // Same clamp as the peak pill: centred when it fits, otherwise flush to the
  // edge it was crossing, so the readout never leaves the panel.
  const w = pill.offsetWidth, cx = x / 100 * r.width;
  let dx = -w / 2;
  if (cx + dx < 0) dx = -cx;
  if (cx + dx + w > r.width) dx = r.width - w - cx;
  pill.style.left = x.toFixed(2) + "%";
  pill.style.transform = "translateX(" + dx.toFixed(1) + "px)";
  const rail = document.querySelector(".rail");
  if (rail) rail.querySelectorAll("i").forEach((b, k) => { b.style.opacity = k === i ? 1 : .22; });
}

function scrubEnd() {
  if (scrubIdx === null) return;
  scrubIdx = null;
  const chart = document.querySelector(".chart");
  if (chart) chart.classList.remove("scrubbing");
  const rail = document.querySelector(".rail");
  if (!rail) return;
  rail.classList.remove("scrubbing");
  // restore each bar's own inline opacity — the rail encodes quiet days at .18
  rail.querySelectorAll("i").forEach((b, k) => { b.style.opacity = railOrig[k]; });
}

document.addEventListener("pointerdown", e => {
  const chart = e.target.closest(".chart"); if (!chart) return;
  const rail = document.querySelector(".rail");
  railOrig = rail ? [...rail.querySelectorAll("i")].map(b => b.style.opacity) : [];
  if (rail) rail.classList.add("scrubbing");
  chart.classList.add("scrubbing");
  scrubTo(chart, e.clientX);
});
document.addEventListener("pointermove", e => {
  if (scrubIdx === null) return;
  const chart = document.querySelector(".chart");
  if (chart) scrubTo(chart, e.clientX);
});
["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, scrubEnd));

function render() {
  const mosaicW = (document.querySelector(".mosaic")?.clientWidth)
    || Math.max(269, Math.min(430, window.innerWidth) - 72);

  // Geometry first: a row's height comes from the row's COMBINED total, so a
  // tile sharing a tall row can be taller than a larger tile sitting alone.
  const geo = [];
  groups.forEach(idxs => {
    const cells = idxs.map(i => cats[i]).filter(Boolean);
    const sum   = cells.reduce((s,c) => s + c.amount, 0);
    const h     = Math.max(MIN_H, Math.round(sum / totalOut * SCALE));
    const gaps  = (cells.length - 1) * 4;
    idxs.forEach(i => { const c = cats[i]; if (!c) return;
      geo[i] = { h, gaps, n: cells.length, pct: c.amount / sum * 100,
                 w: Math.floor(c.amount / sum * (mosaicW - gaps)) };
    });
  });
  // Amount type then follows the AMOUNT, biggest number set biggest, walked in
  // descending order with each size capped by the one above it. The cap matters
  // because a large amount in a narrow tile still has to shrink to fit, and
  // without it that tile could fall below a smaller neighbour, re-inverting the
  // order. Shares of total, not ranks, so the steps survive the data changing.
  cats.map((c,i) => i).sort((a,b) => cats[b].amount - cats[a].amount)
    .reduce((cap, i) => {
      const share = cats[i].amount / totalOut;
      const base  = share >= .18 ? 36 : share >= .12 ? 30 : share >= .07 ? 23 : 20;
      return geo[i].amt = fitAmt(fmt(cats[i].amount), geo[i].w - 28, Math.min(base, cap));
    }, Infinity);

  const rows = groups.map(idxs => {
    const inner = idxs.map(i => {
      const c = cats[i]; if (!c) return "";
      const q = geo[i], nm = fitName(c.name, q.w - 28, 11);  // uniform 11px labels
      return `<button class="cell" type="button" data-cat="${esc(c.name)}" aria-expanded="false"
        style="width:calc(${q.pct.toFixed(2)}% - ${q.gaps/q.n}px);
        background:${c.color};color:${c.ink};gap:${q.h >= 130 ? 8 : 5}px">
        <span class="cname" style="font-size:${nm.size}px;letter-spacing:${nm.track};text-transform:${nm.case}">${c.name}</span>
        <span class="camt" style="font-size:${q.amt}px">${fmt(c.amount)}</span></button>`;
    }).join("");
    return `<div class="mrow" style="height:${geo[idxs[0]].h}px">${inner}</div>`;
  }).join("");

  const chart = buildChart();

  document.getElementById("app").innerHTML = `
    <div class="head">
      <span class="mark">Family Finance</span>
      <span class="pill">${DATA.asOf}</span>
    </div>

    <div class="glass hero">
      <div class="cap">Left to spend</div>
      <div style="display:flex;align-items:baseline;gap:9px;margin-top:10px">
        <span class="big" style="${left < 0 ? "color:" + ORANGE : ""}">${left < 0 ? "−" : ""}${fmt(left)}</span>
        <span style="font-size:15px;font-weight:500;color:rgba(255,244,236,.55)">PKR</span>
      </div>
      <div class="split">
        <div style="width:${(100-keptPct).toFixed(1)}%;background:${ORANGE}"></div>
        <div style="width:${keptPct.toFixed(1)}%;background:${TEAL}"></div>
      </div>
      <div class="legend">
        <span style="display:flex;align-items:center;gap:8px;color:rgba(255,244,236,.72)">
          <span class="dot" style="background:${ORANGE}"></span>${Math.round(100-keptPct)}% spent</span>
        <span style="display:flex;align-items:center;gap:8px;color:#FFF4EC;font-weight:600">
          <span class="dot" style="background:${TEAL}"></span>${Math.round(keptPct)}% kept</span>
      </div>
    </div>

    <div class="pair">
      <div class="glass tile">
        <div class="tlab">Last 7 days</div>
        <div class="tnum">${fmt(last7)}</div>
        <div class="tcap" style="color:${wow === null ? "" : wow <= 0 ? TEAL : ORANGE}">${wowText()}</div>
      </div>
      <div class="glass tile">
        <div class="tlab">Per day</div>
        <div class="tnum">${fmt(perDay)}</div>
        <div class="tcap">${view.length}-day average</div>
      </div>
    </div>

    <div class="glass panel">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
        <span class="h2">Where it went</span><span class="sub" id="mossub">area = amount</span>
      </div>
      <div class="mosaic">${rows}</div>
    </div>

    <div class="glass panel" style="padding:24px 22px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
        <span class="h2">Day by day</span><span class="sub">${windowLabel()}</span>
      </div>
      ${chart}
    </div>`;

  // A resize rebuilds #app, so an open category is restored without animation.
  if (openCat) placeSheet(openCat, false);
}

render();
render();
addEventListener("resize", render);
document.fonts?.ready.then(render);
</script>
</body>
</html>
